<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1c140d" />
  <title>🤠 로프 카우보이</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="600"></canvas>

    <!-- 시작 화면 -->
    <div id="menu" class="overlay">
      <div class="panel">
        <h1>🤠 로프 카우보이</h1>
        <p class="subtitle">올가미를 돌려 적을 <b>납치</b>하고, 잡힌 동료를 <b>구출</b>하라!</p>
        <div class="rules">
          <p>🎯 <b>적</b>을 맞히면 우리 감옥으로 끌어옵니다.</p>
          <p>🛟 적 감옥에 갇힌 <b>우리 팀</b>을 맞히면 구출됩니다.</p>
          <p>🧗 <b>장애물/벽</b>(노란 고리)에 걸면 로프로 끌려가 넘어갑니다.</p>
          <p>📦 <b>상자</b>는 끌어당겨 옮길 수 있어요.</p>
          <p>🏆 적 3명을 <b>동시에</b> 가두면 승리!</p>
        </div>
        <div class="howto">
          <div>📍 왼쪽 <b>조이스틱</b>으로 이동·조준</div>
          <div>🪢 오른쪽 <b>올가미</b> 버튼으로 던지기 (길게 누르면 더 멀리)</div>
        </div>
        <div class="diffrow">
          <label>난이도</label>
          <button class="diff" data-diff="easy">쉬움</button>
          <button class="diff active" data-diff="normal">보통</button>
          <button class="diff" data-diff="hard">어려움</button>
        </div>
        <button id="startBtn" class="big">게임 시작</button>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result" class="overlay hidden">
      <div class="panel">
        <h1 id="resultTitle">승리!</h1>
        <p id="resultText"></p>
        <button id="againBtn" class="big">다시 하기</button>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hudbar">
        <div class="team red"><span class="dot"></span> 레드 <b id="redCaptured">0</b>/3 갇힘</div>
        <div class="timer" id="timer">02:00</div>
        <div class="team blue"><span class="dot"></span> 블루 <b id="blueCaptured">0</b>/3 갇힘</div>
      </div>
    </div>

    <!-- 모바일 조작 -->
    <div id="touch" class="hidden">
      <div id="stick" class="stick"><div class="nub"></div></div>
      <div id="fireBtn" class="fire">올가미</div>
    </div>
  </div>

  <!-- 세로모드일 때 가로 전환 안내 -->
  <div id="rotate">
    <div class="rotate-inner">
      <div class="phone">📱➡️📱</div>
      <p>가로로 돌려서 플레이하세요</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
