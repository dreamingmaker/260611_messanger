name: Build Android APK

on:
  push:
    branches: [ main, "claude/cowboy-rope-mobile" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Lock orientation to landscape
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # MainActivity 에 가로 고정 + 회전 시 재생성 방지
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$MANIFEST"
          grep -q screenOrientation "$MANIFEST" && echo "orientation locked" || echo "manifest not patched"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cowboy-rope-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
