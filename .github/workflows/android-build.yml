name: Build Android APK

on:
  push:
    branches: [ main, "claude/cowboy-rope-mobile" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Lock orientation to landscape
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # MainActivity 에 가로 고정 + 회전 시 재생성 방지
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$MANIFEST"
          grep -q screenOrientation "$MANIFEST" && echo "orientation locked" || echo "manifest not patched"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/cowboy-rope.apk
          ls -lh out/

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cowboy-rope-debug-apk
          path: out/cowboy-rope.apk
          if-no-files-found: error

      - name: Publish APK to Release (직접 다운로드 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: 🤠 로프 카우보이 모바일 (최신 디버그 빌드)
          body: |
            **로프 카우보이** 모바일 앱(Android 디버그 APK)입니다.
            아래 `cowboy-rope.apk` 를 폰에 받아 설치하세요(설정에서 "출처를 알 수 없는 앱 설치" 허용 필요).
            가로 모드 게임입니다. 빌드 커밋: ${{ github.sha }}
          files: out/cowboy-rope.apk
          make_latest: true
